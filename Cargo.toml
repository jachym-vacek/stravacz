[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
stravacz-api = { path = "crates/stravacz-api" }
stravacz-core = { path = "crates/stravacz-core" }

chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
directories = "6.0.0"
futures = "0.3.34"
keyring-core = "1.0.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
rpassword = "7.5.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "charset", "json", "cookies", "gzip"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }
unicode-width = "0.2.2"
windows-native-keyring-store = "1.0.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
strip = true
