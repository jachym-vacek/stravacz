[package]
name = "stravacz-tui"
description = "Order school canteen meals from Strava.cz in your terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "stravacz-tui"
path = "src/main.rs"

[features]
# See `stravacz-core`; release builds enable it.
vendored-dbus = ["stravacz-core/vendored-dbus"]

[dependencies]
chrono.workspace = true
anyhow.workspace = true
crossterm.workspace = true
futures.workspace = true
ratatui.workspace = true
stravacz-core.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
stravacz-api = { workspace = true, features = ["mock"] }
wiremock.workspace = true

[lints]
workspace = true
